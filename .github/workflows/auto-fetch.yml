name: Auto Fetch Weekly Articles

on:
  schedule:
    # GitHub cron 使用 UTC：周五 14:00 = 北京时间周五 22:00。
    - cron: "0 14 * * 5"
  workflow_dispatch:

concurrency:
  group: weekly-article-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      WEEKLY_TIMEZONE: Asia/Shanghai
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install --requirement requirements.txt

      - name: 检查 DeepSeek Secret
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::请在仓库 Settings > Secrets and variables > Actions 中添加 DEEPSEEK_API_KEY"
            exit 1
          fi

      - name: 生成周刊
        run: python src/hacker_news_weekly.py

      - name: 验证周刊输出
        run: python scripts/health_check.py --expect-current-month

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 验证站点构建
        run: |
          npm ci
          npm run build

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs

          if git diff --cached --quiet; then
            echo "内容没有变化，无需提交。"
            exit 0
          fi

          issue_date=$(TZ=Asia/Shanghai date +%Y.%m.%d)
          git commit -m "📅 自动更新周刊 ${issue_date}"
          git push origin HEAD:main

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-generation-log-${{ github.run_id }}
          path: weekly_generation.log
          if-no-files-found: warn
          retention-days: 14
